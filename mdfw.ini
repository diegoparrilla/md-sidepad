; mdfw.ini - MD/Sidepad built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/Sidepad
output = build/md-sidepad.mdfw
; Built on the SidecarTridge microfirmware template: its own main() runs,
; with EmuMD standing in for the template's hardware and the Booster. The
; version comes from version.txt. uuid.txt is deliberately not committed,
; so this names the sample UUID rp/src/CMakeLists.txt falls back to.
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
; The firmware, as rp/src/CMakeLists.txt lists it. download.c is left
; out: nothing calls it, and it needs an HTTP client the stand-in lacks.
; So is u8g2_d_setup.c, u8g2's stock display setups, which name drivers
; this copy of u8g2 does not carry: the firmware sets the display up
; itself (display.c), and the device's linker drops the file as unused.
files =
    rp/src/*.c
    rp/src/settings/settings.c
    rp/src/u8g2/*.c
exclude =
    rp/src/download.c
    rp/src/u8g2/u8g2_d_setup.c

[compile]
include =
    rp/src
    rp/src/include
    rp/src/settings
    rp/src/u8g2
    rp/src/bt
    xpad/src
; What rp/src/CMakeLists.txt defines for a pico_w, besides the template's
; usual ones and CYW43_ENABLE_BLUETOOTH, which [bluetooth] supplies.
defines =
    BOARD_TYPE_PICO_W=1
    BOARD_TYPE_PICO=0
    BOARD_TYPE_CUSTOM16MB=0
cflags = -O2

; Bluetooth and Wi-Fi share the CYW43, and controller_init() brings it up
; through cyw43_arch_init(), so [bluetooth] needs [wifi] even though
; MD/Sidepad never joins a network.
[wifi]
lwip = pico-sdk/lib/lwip
arch = poll

; Bluepad32, played from a script of controllers: make emu PADS=FILE, and
; emu/test/pads.txt for the format.
[bluetooth]

[run]
; No harddrive: a GEMDOS drive takes the first 1 KB of the cartridge,
; which is where MD/Sidepad's boot code lives. Programs for the ST side
; go on a floppy instead (emu/test.sh).
machine = ste
sd = build/sd
